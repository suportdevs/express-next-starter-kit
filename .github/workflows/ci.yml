name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kit:kit@localhost:5432/kit_test
      TEST_DATABASE_URL: postgres://kit:kit@localhost:5432/kit_test
      APP_SECRET: ci-secret-that-is-at-least-32-characters-long
      SMTP_HOST: ''
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate test database
        run: npm run db:migrate
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
